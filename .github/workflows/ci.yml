name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      no_remote_cache:
        description: "Ignore cached remote results (--noremote_accept_cached)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Stage 1: Fast gate
  unit:
    name: Unit + Analysis + Golden
    runs-on: ubuntu-latest
    outputs:
      e2e-workspaces: ${{ steps.set-matrix.outputs.e2e }}
      cross-workspaces: ${{ steps.set-matrix.outputs.cross }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: set-matrix
        run: |
          e2e_ws=()
          cross_ws=()
          for d in tests/e2e/* modules/* examples/*; do
            if [ -f "$d/MODULE.bazel" ] || [ -f "$d/WORKSPACE" ] || [ -f "$d/WORKSPACE.bazel" ]; then
              ws_name=$(basename "$d")
              if [ "$ws_name" != "shared" ]; then
                if [[ "$ws_name" == build_* ]]; then
                  cross_ws+=("\"$ws_name\"")
                else
                  e2e_ws+=("\"$d\"")
                fi
              fi
            fi
          done
          echo "e2e=[$(IFS=,; echo "${e2e_ws[*]}")]" >> $GITHUB_OUTPUT
          echo "cross=[$(IFS=,; echo "${cross_ws[*]}")]" >> $GITHUB_OUTPUT
      - name: Configure BuildBuddy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build:remote --remote_header=x-buildbuddy-api-key=lXj8mtc6dMxIxXnaj5y4" > .bazelrc.user
            echo "build:remote --noremote_upload_local_results" >> .bazelrc.user
          else
            echo "build:remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" > .bazelrc.user
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.no_remote_cache }}" = "true" ]; then
            echo "build:remote --noremote_accept_cached" >> .bazelrc.user
          fi
      - name: Test
        run: |
          bazel \
            --bazelrc=.github/workflows/ci.bazelrc \
            test --config=remote \
            -- //pycross/... //tests/... -//tests/e2e/...

  # Stage 2: E2E integration tests
  e2e:
    name: E2E - ${{ matrix.workspace }} (Bazel ${{ matrix.bazel }})
    needs: [unit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["8.7.0", "9.1.0"]
        workspace: ${{ fromJSON(needs.unit.outputs.e2e-workspaces) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          repository-cache: true
          bazelrc: |
            common --announce_rc
            common --color=yes
            test --test_output=errors
      - name: Configure
        working-directory: ${{ matrix.workspace }}
        run: |
          echo "${{ matrix.bazel }}" > .bazelversion
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build:remote --remote_header=x-buildbuddy-api-key=lXj8mtc6dMxIxXnaj5y4" > .bazelrc.user
            echo "build:remote --noremote_upload_local_results" >> .bazelrc.user
          else
            echo "build:remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" > .bazelrc.user
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.no_remote_cache }}" = "true" ]; then
            echo "build:remote --noremote_accept_cached" >> .bazelrc.user
          fi
      - name: Build
        working-directory: ${{ matrix.workspace }}
        run: |
          if [ -f "run.sh" ]; then
            echo "Skipping default build, run.sh will handle it."
          else
            bazel build --config=remote --experimental_convenience_symlinks=ignore //...
          fi
      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: |
          if [ -f "run.sh" ]; then
            ./run.sh --config=remote
          else
            if bazel query "tests(//...)" 2>/dev/null | grep -q .; then
              bazel test --config=remote --experimental_convenience_symlinks=ignore //...
            else
              echo "No test targets found, skipping."
            fi
          fi

  # Stage 3: Cross-platform builds
  cross-build:
    name: Build - ${{ matrix.workspace }} on ${{ matrix.host }}
    needs: [unit]
    runs-on: ${{ format('{0}-latest', matrix.host) }}
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu, macos]
        workspace: ${{ fromJSON(needs.unit.outputs.cross-workspaces) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable unprivileged user namespaces
        if: matrix.host == 'ubuntu'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Configure BuildBuddy
        working-directory: tests/e2e/${{ matrix.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build:remote --remote_header=x-buildbuddy-api-key=lXj8mtc6dMxIxXnaj5y4" > .bazelrc.user
            echo "build:remote --noremote_upload_local_results" >> .bazelrc.user
          else
            echo "build:remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" > .bazelrc.user
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.no_remote_cache }}" = "true" ]; then
            echo "build:remote --noremote_accept_cached" >> .bazelrc.user
          fi
      - name: Build all wheels and run tests
        working-directory: tests/e2e/${{ matrix.workspace }}
        run: |
          bazel build --config=remote //:all_wheels
          if [ -f "run.sh" ]; then
            ./run.sh --config=remote
          else
            bazel test --config=remote //...
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.host }}-${{ matrix.workspace }}
          path: tests/e2e/${{ matrix.workspace }}/bazel-bin/all_wheels/

  # Stage 3b: Test built wheels on target platforms
  cross-test:
    name: Test - (${{ matrix.builder }}→${{ matrix.runner }})
    needs: [cross-build, unit]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        builder: [ubuntu, macos]
        runner: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-${{ matrix.builder }}-*
          path: ${{ runner.temp }}/artifacts
      - name: Test workspaces
        run: |
          for ws in ${{ join(fromJSON(needs.unit.outputs.cross-workspaces), ' ') }}; do
            if [ "${{ runner.os }}-${{ runner.arch }}" = "Linux-ARM64" ]; then
              # Only these workspaces build linux_aarch64 wheels (or only pure wheels).
              case "$ws" in
                build_meson|build_pure_python|build_setuptools) ;;
                *) echo "Skipping $ws: no linux_aarch64 wheels"; continue ;;
              esac
            fi
            echo "::group::Testing $ws"

            python -m venv ${{ runner.temp }}/venv-$ws
            source ${{ runner.temp }}/venv-$ws/bin/activate

            mkdir -p ${{ runner.temp }}/install-wheels-$ws
            artifact_dir="${{ runner.temp }}/artifacts/wheels-${{ matrix.builder }}-$ws"

            case "${{ runner.os }}-${{ runner.arch }}" in
              Linux-X64) cp $artifact_dir/*manylinux*_x86_64.whl ${{ runner.temp }}/install-wheels-$ws/ 2>/dev/null || true ;;
              Linux-ARM64) cp $artifact_dir/*manylinux*_aarch64.whl ${{ runner.temp }}/install-wheels-$ws/ 2>/dev/null || true ;;
              *) cp $artifact_dir/*macosx*.whl ${{ runner.temp }}/install-wheels-$ws/ 2>/dev/null || true ;;
            esac
            cp $artifact_dir/*none-any*.whl ${{ runner.temp }}/install-wheels-$ws/ 2>/dev/null || true
            if ! ls ${{ runner.temp }}/install-wheels-$ws/*.whl 1> /dev/null 2>&1; then
              echo "Error: No wheels found to install for $ws"
              exit 1
            fi

            pip install pytest ${{ runner.temp }}/install-wheels-$ws/*.whl
            cd tests/e2e/$ws
            python -m pytest tests/ -v
            cd ../../..

            deactivate
            echo "::endgroup::"
          done

  # Stage 3b (musl): Test musllinux wheels in an Alpine container
  cross-test-musl:
    name: Test - (${{ matrix.builder }}→musl)
    needs: [cross-build, unit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        builder: [ubuntu, macos]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-${{ matrix.builder }}-*
          path: ${{ runner.temp }}/artifacts
      - name: Test workspaces
        env:
          WORKSPACES: ${{ join(fromJSON(needs.unit.outputs.cross-workspaces), ' ') }}
        run: |
          docker run --rm -e WORKSPACES -e BUILDER=${{ matrix.builder }} \
            -v "$PWD:/src" -v "${{ runner.temp }}/artifacts:/artifacts:ro" \
            python:3.14-alpine sh -euc '
              for ws in $WORKSPACES; do
                # Only these workspaces build linux_x86_64_musl wheels.
                case "$ws" in
                  build_cmake|build_meson|build_setuptools) ;;
                  *) echo "Skipping $ws: no musllinux wheels"; continue ;;
                esac
                echo "::group::Testing $ws"
                wheels=$(ls /artifacts/wheels-$BUILDER-$ws/*musllinux*_x86_64.whl /artifacts/wheels-$BUILDER-$ws/*none-any*.whl 2>/dev/null || true)
                if [ -z "$wheels" ]; then
                  echo "Error: No wheels found to install for $ws"
                  exit 1
                fi
                python -m venv /tmp/venv-$ws
                /tmp/venv-$ws/bin/pip install pytest $wheels
                cd /src/tests/e2e/$ws
                /tmp/venv-$ws/bin/python -m pytest tests/ -v -p no:cacheprovider
                echo "::endgroup::"
              done
            '

  # Stage 3c: Reproducibility check
  reproducibility:
    name: Repro check
    needs: [cross-build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-ubuntu-*
          path: ${{ runner.temp }}/linux-wheels
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-macos-*
          path: ${{ runner.temp }}/macos-wheels
          merge-multiple: true
      - name: Compare wheels
        run: python tests/e2e/tools/compare_wheels.py ${{ runner.temp }}/linux-wheels ${{ runner.temp }}/macos-wheels

  # Gate for branch protection
  conclusion:
    needs: [unit, e2e, cross-test, cross-test-musl, reproducibility]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5  # v3.0.3
      - name: Report
        run: |
          echo "Workflow conclusion: $WORKFLOW_CONCLUSION"
          [ "$WORKFLOW_CONCLUSION" = "success" ] && exit 0 || exit 1
