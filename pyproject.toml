[project]
name = "rules_pycross"
version = "0.0"
authors = []
requires-python = ">=3.11"

[project.optional-dependencies]
# core dependencies are required by repo rules
core = [
    "installer==1.1.0",
    "packaging==26.3",
]
build = [
    "build==1.6.1",
]
repairwheel = [
    "repairwheel==0.8.0",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pylint]
line-length = 120

[tool.flakeheaven]
max_line_length = 120

[tool.flakeheaven.plugins]
"flake8-*" = ["+*"]
flake8-import-restrictions = ["+I2043"]
pyflakes = ["+*", "-F541"]

[tool.flakeheaven.exceptions."**/*.md"]
pyflakes = ["-*"]
