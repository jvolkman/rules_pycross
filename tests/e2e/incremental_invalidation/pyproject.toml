[project]
name = "incremental-invalidation-test"
version = "0.1.0"
requires-python = ">=3.9, <3.15"
dependencies = [
    "python-dateutil==2.9.0.post0",
    "six==1.16.0",
]

[project.optional-dependencies]
a = ["cowsay==6.1"]
b = ["iniconfig==2.0.0"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
conflicts = [
    [{ extra = "a" }, { extra = "b" }],
]
