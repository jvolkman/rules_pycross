[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.11.0"
dependencies = []

[project.optional-dependencies]
variant-a = [
  "typing-extensions==4.11.0 ; sys_platform != 'win32'",
  "jinja2==3.1.6 ; sys_platform == 'linux'",
]
variant-b = [
  "typing-extensions==4.11.0 ; sys_platform == 'darwin'",
  "typing-extensions==4.12.2 ; sys_platform != 'win32' and sys_platform != 'darwin'",
  "jinja2==3.1.6 ; sys_platform != 'win32'",
]

[dependency-groups]
group-a = [
  "idna==3.7",
]
group-b = [
  "idna==3.10",
]

[tool.uv]
# group-a is the default, so builds without explicit flags use group-a.
default-groups = ["group-a"]
conflicts = [
  [
    { extra = "variant-a" },
    { extra = "variant-b" },
  ],
  [
    { group = "group-a" },
    { group = "group-b" },
  ],
]
