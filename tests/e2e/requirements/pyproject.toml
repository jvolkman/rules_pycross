[project]
name = "rules-pycross-test"
version = "0.1.0"
description = ""
requires-python = ">=3.9, <3.15"
dependencies = [
    "attrs>=24.2.0",
    "beautifulsoup4>=4.12.3",
    "ipython>=8.18.1",
    # Last release whose wheel ships a mixed-case .dist-info (Pygments-2.16.1.dist-info); test_dist_info depends on it. Don't bump.
    "pygments==2.16.1",
    "python-dateutil>=2.9.0",
    "regex>=2024.11.6",
    "six>=1.17.0",
    "rerun-sdk",
    "packaging @ git+https://github.com/pypa/packaging.git@23.2",
    "flit-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
