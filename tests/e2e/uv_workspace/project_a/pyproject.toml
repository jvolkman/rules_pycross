[project]
name = "project-a"
version = "0.1.0"
description = ""
requires-python = ">=3.10, <3.15"
dependencies = [
    "regex>=2024.11.6",
    "six>=1.17.0",
]

[dependency-groups]
# Conflicts with the other member's `test` group (same name, different version).
test = ["iniconfig==1.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# A per-member default. Bazel repos that request only `test` select it anyway.
default-groups = ["test"]
