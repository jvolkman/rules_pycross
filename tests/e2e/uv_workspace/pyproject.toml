[project]
name = "workspace-root"
version = "0.1.0"
description = "Test workspace with multiple members"
requires-python = ">=3.10, <3.15"
dependencies = []

[tool.uv]
package = false
conflicts = [
    [
        { package = "project-a", group = "test" },
        { package = "project-b", group = "test" },
    ],
]

[tool.uv.workspace]
members = ["project_a", "project_b"]

[tool.uv.sources]
project-a = { workspace = true }
project-b = { workspace = true }
