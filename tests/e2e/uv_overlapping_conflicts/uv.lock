version = 1
revision = 3
requires-python = ">=3.11"
conflicts = [[
    { package = "app", extra = "cpu" },
    { package = "app", extra = "gpu" },
], [
    { package = "app", extra = "cpu" },
    { package = "app", group = "gpu-test" },
]]

[[package]]
name = "app"
version = "0.1.0"
source = { virtual = "." }

[package.optional-dependencies]
cpu = [
    { name = "iniconfig", version = "1.1.1", source = { registry = "https://pypi.org/simple" } },
]
gpu = [
    { name = "iniconfig", version = "2.0.0", source = { registry = "https://pypi.org/simple" } },
]

[package.dev-dependencies]
gpu-test = [
    { name = "iniconfig", version = "2.0.0", source = { registry = "https://pypi.org/simple" } },
    { name = "six" },
]

[package.metadata]
requires-dist = [
    { name = "iniconfig", marker = "extra == 'cpu'", specifier = "==1.1.1" },
    { name = "iniconfig", marker = "extra == 'gpu'", specifier = "==2.0.0" },
]
provides-extras = ["cpu", "gpu"]

[package.metadata.requires-dev]
gpu-test = [
    { name = "iniconfig", specifier = "==2.0.0" },
    { name = "six", specifier = "==1.17.0" },
]

